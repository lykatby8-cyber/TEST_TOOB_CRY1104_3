name: Toobit Crypto Pre-Move Hunter v3

on:
  schedule:
    - cron: '3-59/6 * * * *'
  workflow_dispatch:

concurrency:
  group: toobit-pre-move-hunter
  cancel-in-progress: false

permissions:
  contents: read

