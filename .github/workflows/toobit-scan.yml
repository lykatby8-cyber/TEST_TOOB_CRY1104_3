          mkdir -p data
          printf '%s' "$SCANNER_B64" | base64 --decode > toobit_hunter.py

      - name: Run one scan
        env:
          RUN_ONCE: '1'
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
          DEEP_SCAN_TOP: '60'
          MIN_SCORE: '62'
          MIN_DIRECTION_GAP: '8'
          MAX_24H_MOVE: '7'
          MIN_24H_QUOTE_VOLUME: '100000'
          WORKERS: '4'
          TIMEOUT: '18'
          CANDIDATE_TTL_MINUTES: '60'
        run: python -u toobit_hunter.py

      - name: Save scanner history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/toobit_crypto_hunter_v3.db
          key: toobit-state-${{ github.run_id }}-${{ github.run_attempt }}
